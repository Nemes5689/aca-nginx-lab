name: Build and test Nginx
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aca-nginx:ci .
      - name: Run and test
        run: |
          docker run -d --name web -p 8080:80 aca-nginx:ci
          for i in 1 2 3 4 5; do
            curl --fail http://localhost:8080 && exit 0
            sleep 2
          done
          exit 1
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: nemes5689/aca-nginx-lab:${{ github.sha }}
          outputs: type=image,oci-mediatypes=true,compression=gzip,force-compression=true
